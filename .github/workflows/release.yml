name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract tag metadata
        id: meta
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          COMMIT="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Verify tag is reachable from origin/main
        shell: bash
        run: |
          git fetch origin main
          COMMIT="${{ steps.meta.outputs.commit }}"
          if ! git merge-base --is-ancestor "${COMMIT}" "origin/main"; then
            echo "Tagged commit ${COMMIT} is not reachable from origin/main" >&2
            exit 1
          fi

      - name: Verify release metadata versions match tag
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          CARGO_VERSION="$(grep -E '^version = "' Cargo.toml | head -n1 | cut -d'"' -f2)"
          if [ "${CARGO_VERSION}" != "${VERSION}" ]; then
            echo "Cargo.toml version ${CARGO_VERSION} does not match tag v${VERSION}" >&2
            exit 1
          fi

          if ! grep -Fq "## [${VERSION}] -" CHANGELOG.md; then
            echo "CHANGELOG.md is missing section for ${VERSION}" >&2
            exit 1
          fi

          if ! grep -Fq "version = \"${VERSION}\"" gov/releases.toml; then
            echo "gov/releases.toml is missing release entry for ${VERSION}" >&2
            exit 1
          fi

      - name: Generate release notes from CHANGELOG
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          PREVIOUS_TAG="$(git tag --sort=-version:refname | sed -n '2p')"
          {
            printf '## %s\n\n' "govctl v${VERSION}"
            awk -v version="${VERSION}" '
              $0 ~ "^## \\[" version "\\] - " { capture=1; next }
              capture && $0 ~ "^## \\[" { exit }
              capture { print }
            ' CHANGELOG.md
            if [ -n "${PREVIOUS_TAG}" ]; then
              printf '\n**Full Changelog**: https://github.com/%s/compare/%s...v%s\n' \
                "${GITHUB_REPOSITORY}" \
                "${PREVIOUS_TAG}" \
                "${VERSION}"
            fi
          } > release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 1

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rust-cross/cargo-zigbuild@sha256:b8f4954230e4393922593838728213f54557207df9cc06f4063005268fbc0da3
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            binary: govctl
            archive: tar.gz
            alias: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-musl
            binary: govctl
            archive: tar.gz
            alias: aarch64-unknown-linux-gnu
          - target: x86_64-apple-darwin
            binary: govctl
            archive: tar.gz
          - target: aarch64-apple-darwin
            binary: govctl
            archive: tar.gz
          - target: x86_64-pc-windows-gnu
            binary: govctl.exe
            archive: zip
            alias: x86_64-pc-windows-msvc
          - target: aarch64-pc-windows-gnullvm
            binary: govctl.exe
            archive: zip
            alias: aarch64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: cargo zigbuild --release --locked --target "${{ matrix.target }}"

      - name: Install ZIP packaging tool
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends zip

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          ARCHIVE: ${{ matrix.archive }}
          ALIAS: ${{ matrix.alias }}
        run: |
          package_target() {
            local distribution_target="$1"
            local name="govctl-v${VERSION}-${distribution_target}"

            mkdir -p "dist/${name}"
            cp "target/${TARGET}/release/${BINARY}" "dist/${name}/"
            cp README.md LICENSE* "dist/${name}/" 2>/dev/null || true

            if [ "${ARCHIVE}" = "zip" ]; then
              (cd dist && zip -qr "${name}.zip" "${name}")
            else
              tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            fi
          }

          package_target "${TARGET}"
          if [ "${VERSION%%.*}" = "0" ] && [ -n "${ALIAS}" ]; then
            package_target "${ALIAS}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 1

  smoke-cross:
    name: Smoke ${{ matrix.target }}
    needs: [verify, build]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            alias: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            binary: govctl
          - target: aarch64-unknown-linux-musl
            alias: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
            binary: govctl
          - target: x86_64-pc-windows-gnu
            alias: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            binary: govctl.exe
          - target: aarch64-pc-windows-gnullvm
            alias: aarch64-pc-windows-msvc
            os: windows-11-arm
            archive: zip
            binary: govctl.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.target }}
          path: artifact

      - name: Extract and verify archive layouts
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
          ALIAS: ${{ matrix.alias }}
          ARCHIVE: ${{ matrix.archive }}
          BINARY: ${{ matrix.binary }}
        run: |
          extract_target() {
            local distribution_target="$1"
            local name="govctl-v${VERSION}-${distribution_target}"
            if [ "${ARCHIVE}" = "zip" ]; then
              unzip -q "artifact/${name}.zip" -d extracted
            else
              tar -xzf "artifact/${name}.tar.gz" -C extracted
            fi
          }

          mkdir extracted
          extract_target "${TARGET}"
          if [ "${VERSION%%.*}" = "0" ]; then
            extract_target "${ALIAS}"
            cmp \
              "extracted/govctl-v${VERSION}-${TARGET}/${BINARY}" \
              "extracted/govctl-v${VERSION}-${ALIAS}/${BINARY}"
          elif compgen -G "artifact/*-${ALIAS}.*" >/dev/null; then
            echo "Compatibility alias ${ALIAS} must not be published for ${VERSION}" >&2
            exit 1
          fi

      - name: Smoke compatibility
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          BINARY_PATH="extracted/govctl-v${VERSION}-${TARGET}/${BINARY}"
          if [ "${RUNNER_OS}" != "Windows" ]; then
            chmod +x "${BINARY_PATH}"
          fi
          "${BINARY_PATH}" --version
          "${BINARY_PATH}" check

      - name: Probe self-update API
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          BINARY_PATH="extracted/govctl-v${VERSION}-${TARGET}/${BINARY}"
          "${BINARY_PATH}" self-update --check

  smoke-macos:
    name: Smoke macOS artifacts
    needs: [verify, build]
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download x86_64 artifact
        uses: actions/download-artifact@v8
        with:
          name: x86_64-apple-darwin
          path: artifact

      - name: Download aarch64 artifact
        uses: actions/download-artifact@v8
        with:
          name: aarch64-apple-darwin
          path: artifact

      - name: Extract artifacts
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir extracted
          for TARGET in x86_64-apple-darwin aarch64-apple-darwin; do
            NAME="govctl-v${VERSION}-${TARGET}"
            tar -xzf "artifact/${NAME}.tar.gz" -C extracted
            chmod +x "extracted/${NAME}/govctl"
          done

      - name: Smoke compatibility
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ARM_BINARY="extracted/govctl-v${VERSION}-aarch64-apple-darwin/govctl"
          X86_BINARY="extracted/govctl-v${VERSION}-x86_64-apple-darwin/govctl"

          "${ARM_BINARY}" --version
          "${ARM_BINARY}" check
          arch -x86_64 "${X86_BINARY}" --version
          arch -x86_64 "${X86_BINARY}" check

      - name: Probe self-update API
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ARM_BINARY="extracted/govctl-v${VERSION}-aarch64-apple-darwin/govctl"
          X86_BINARY="extracted/govctl-v${VERSION}-x86_64-apple-darwin/govctl"

          "${ARM_BINARY}" self-update --check
          arch -x86_64 "${X86_BINARY}" self-update --check

  release:
    name: Create Release
    needs: [verify, build, smoke-cross, smoke-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Extract version
        run: echo "VERSION=v${{ needs.verify.outputs.version }}" >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.VERSION }}
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
          generate_release_notes: false
          body_path: artifacts/release-notes.md
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
