#:schema ../schema/work.schema.json

[govctl]
id = "WI-2026-09-26-002"
title = "Explain why the primary workspace cannot be determined in the trunk-scope warning"
status = "done"
created = "2026-09-26"
started = "2026-09-26"
completed = "2026-09-26"
refs = ["RFC-0010:C-COMMAND-SCOPE"]

[content]
description = "The warning that trunk-scope enforcement is inactive always tells users to set `workspace.primary` in `gov/config.toml`, but that setting only helps when no jj workspace has the primary name. When the VCS tool cannot report the workspace layout, when the git repository is bare or uses a separate git directory, or when the current jj workspace cannot be identified, the hint sends users toward a fix that cannot work. Make the warning state which condition prevented determining the primary workspace and give a hint that addresses that condition."

[[content.acceptance_criteria]]
text = "the trunk-scope enforcement-inactive warning names the condition that prevented determining the primary workspace"
status = "done"
category = "fixed"

[[content.acceptance_criteria]]
text = "the trunk-scope enforcement-inactive warning suggests setting workspace.primary only when no jj workspace has the configured or default primary name"
status = "done"
category = "fixed"

[verification]
required_guards = ["GUARD-CARGO-TEST"]
