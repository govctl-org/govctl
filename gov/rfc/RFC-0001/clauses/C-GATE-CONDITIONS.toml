#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-GATE-CONDITIONS"
title = "Transition Gate Conditions"
kind = "normative"
status = "active"
since = "0.1.0"
tags = [
    "lifecycle",
    "validation",
]

[content]
text = """
Certain transitions have additional gate conditions beyond the state machine rules.

**Work Item -> done:**
1. The work item MUST have at least one acceptance criterion defined.
2. All acceptance criteria MUST have status `done` or `cancelled`.
3. Every guard named in the work item's `verification.required_guards` MUST pass or be explicitly waived with a reason.
4. If project verification is enabled, every project-level default guard MUST also pass or be explicitly waived with a reason.

The effective required verification guards are the union of the work item's `verification.required_guards` and, only when project verification is enabled, the project's configured default guards. Only guards covered by explicit waivers are removed from that set. A guard reference is unusable when a Guard ID in that effective set does not identify an existing Guard, when the Work Item records more than one waiver for the same Guard, when a waiver reason is empty after trimming surrounding whitespace, when a waiver names a Guard that does not exist, or when a waiver names a Guard outside the required set before waivers. An invocation that performs the transition MUST reject an unusable guard reference, MUST leave the Work Item unchanged, and MUST NOT execute guards.

A pass record that meets [[RFC-0001:C-PASS-RECORD]] satisfies conditions 3 and 4 without executing guards. When the transition supplies no pass record and the guard reference is usable, an invocation that performs the transition MUST execute every guard in the effective required set, and each executed guard MUST pass. When that invocation supplies no pass record, the guard reference is usable, and that set is empty, conditions 3 and 4 are satisfied without execution. Supplying a pass record MUST NOT use this empty-set rule. A global `--dry-run` invocation does not perform the transition. It MUST NOT execute those guards and MUST NOT claim that any guard passed. The preview report is defined by [[RFC-0002:C-LIFECYCLE-VERBS]].

Rationale: Prevents marking work as complete without defined success criteria or executable completion proof.

**RFC draft -> normative:**
- No additional gates (policy decision, not structural).

**RFC phase spec -> impl:**
- RFC status MUST be normative.
- Every clause MUST have a resolved `since` version under [[RFC-0000:C-CLAUSE-DEF]].

Rationale: Implementation must follow a ratified and version-resolved specification.

**RFC phase impl -> test:**
- No additional gates.

**RFC phase test -> stable:**
- No additional gates (assumes tests are passing externally).

Future gates MAY be added via RFC amendment, but MUST NOT break existing valid workflows. Project verification MUST default to disabled when the project config does not opt into it."""
